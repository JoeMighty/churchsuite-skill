name: Checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compiles
        run: python3 -m py_compile churchsuite/scripts/*.py
      - name: JSON valid
        run: python3 -c "import json;json.load(open('evals/evals.json'))"
      - name: No em or en dashes
        run: "! grep -rnP '\\xe2\\x80[\\x93\\x94]' --exclude-dir=.git ."
