name: Link check

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,403,429 "churchsuite/**/*.md" README.md
          fail: false
